name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Una PR che riceve più push annulla i run precedenti: meno rumore, meno minuti bruciati.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # `verify` include Spotless (check del formato), Enforcer e i test.
      - name: Build e verifica
        run: mvn -B verify

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint (ESLint + regole di accessibilità)
        run: npm run lint

      - name: Formattazione (Prettier)
        run: npm run format:check

      # In Angular l'AOT non è un flag: il builder `application` compila sempre
      # in AOT. È qui che emergono gli errori di tipo nei template, che
      # `ng serve` non mostra. Per questo il build di CI è quello di produzione.
      - name: Build AOT di produzione
        run: npx ng build --configuration production

      # `npm test` è volutamente assente: la suite è rossa per uno spec
      # scaffold mai adattato (issue #7). Va riattivato quando #7 è chiusa —
      # un job verde che salta i test è peggio di un job che non li ha.

  harness:
    name: Harness (hook)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gli hook sono ~200 righe di shell che nessun compilatore guarda.
      # Il bug `timeout` (GNU, assente su macOS) è sopravvissuto per ore
      # proprio perché niente li eseguiva.
      - name: Test degli hook
        run: ./agents/hooks/test-hooks.sh
