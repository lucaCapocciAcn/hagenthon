name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Una PR che riceve più push annulla i run precedenti: meno rumore, meno minuti bruciati.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # `verify` include Spotless (check del formato), Enforcer e i test.
      - name: Build e verifica
        run: mvn -B verify

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install
        run: npm ci

      # Nessuno step di lint: il linter non è ancora installato sul frontend.
      - name: Build
        run: npm run build
